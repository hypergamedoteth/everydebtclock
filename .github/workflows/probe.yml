name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) everydebtclock.com"
          pip install -q xlrd 2>&1 | tail -1
          curl -s -m 40 -A "$UA" "https://minfin.gov.ru/common/upload/library/2026/10/main/Obem_gosdolga_s_garantiyami_god_polnostu_na_01_10_2026.xls" -o /tmp/x.xls
          python3 - <<'PY'
          import xlrd
          b=xlrd.open_workbook('/tmp/x.xls')
          for n in ('2025 г.','2026 г.'):
              s=b.sheet_by_name(n)
              for r in range(s.nrows):
                  print(n,r,[str(c.value).strip()[:30] for c in s.row(r) if c.value!=''])
          PY

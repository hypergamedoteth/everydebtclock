name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y poppler-utils >/dev/null 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) everydebtclock.com"
          curl -s -m 60 -L -A "$UA" "http://dea.gov.in/reports-public-debt-management" -o /tmp/dea.html
          curl -s -m 60 -L -A "$UA" "https://minfin.gov.ru/ru/perfomance/public_debt/internal/" -o /tmp/in.html
          curl -s -m 60 -L -A "$UA" "https://minfin.gov.ru/ru/perfomance/public_debt/external/" -o /tmp/ex.html
          python3 - <<'PY'
          import re,html,subprocess
          t=open('/tmp/dea.html',encoding='utf-8',errors='replace').read()
          hs=re.findall(r'href="([^"]*Report[^"]*Public[^"]*Debt[^"]*Management[^"]*quarter[^"]*)"',t)
          h=hs[0]
          u=h.replace('https://','http://').replace(' ','%20')
          subprocess.run(['curl','-s','-m','90','-L','-A','Mozilla/5.0',u,'-o','/tmp/r0.pdf'])
          x=subprocess.run(['pdftotext','-layout','/tmp/r0.pdf','-'],capture_output=True,text=True).stdout.splitlines()
          idx=[i for i,l in enumerate(x) if 'Table 4.1: Total Liabilities' in l]
          print('IDX',idx)
          i=idx[-1]
          for l in x[i:i+45]: print('P0',re.sub(r'\s{3,}','  |  ',l.rstrip())[:170])
          for n in ('in','ex'):
              s=open('/tmp/%s.html'%n,encoding='utf-8',errors='replace').read()
              print('MF',n,len(s))
              i=s.find('dept_point')
              seg=s[i-200:i+4500]
              seg=re.sub(r'\s+',' ',seg)
              print('MFRAW',n,seg[:3500])
              for m in re.finditer(r'href="([^"]*\.xlsx?[^"]*)"',s): print('MFLINK',n,m.group(1)[:140])
          PY

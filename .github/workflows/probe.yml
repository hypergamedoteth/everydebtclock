name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install xlrd openpyxl >/dev/null 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) everydebtclock.com"
          B=https://minfin.gov.ru/common/upload/library/2026
          curl -s -m 60 -L -A "$UA" "$B/10/main/Obem_gosdolga_s_garantiyami_god_polnostu_na_01_10_2026.xls" -o /tmp/a.xls
          curl -s -m 60 -L -A "$UA" "$B/01/main/Obem_gos._dolga_s_vydeleniem_garantiy_na_01.01.26_po_godam.xls" -o /tmp/b.xls
          curl -s -m 60 -L -A "$UA" "$B/10/main/graphDynamicsDebt_ru_01.10.2026.xlsx" -o /tmp/c.xlsx
          ls -la /tmp/a.xls /tmp/b.xls /tmp/c.xlsx
          python3 - <<'PY'
          import xlrd, openpyxl
          for n in ('a','b'):
              wb=xlrd.open_workbook('/tmp/%s.xls'%n)
              for sh in wb.sheets():
                  print('XLS',n,sh.name,sh.nrows,sh.ncols)
                  for r in range(min(sh.nrows,60)):
                      row=[str(c.value)[:60] for c in sh.row(r) if c.value!='']
                      if row: print('XLS',n,r,row[:16])
          wb=openpyxl.load_workbook('/tmp/c.xlsx',data_only=True)
          for ws in wb.worksheets:
              print('XLSX',ws.title,ws.max_row,ws.max_column)
              for row in ws.iter_rows(min_row=1,max_row=40,values_only=True):
                  r=[str(v)[:50] for v in row if v is not None]
                  if r: print('XLSX',r[:14])
          PY

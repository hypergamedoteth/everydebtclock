name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) everydebtclock.com"
          curl -s -m 25 -L -A "$UA" "http://dea.gov.in/reports-public-debt-management" -o /tmp/dea.html
          python3 - <<'PY'
          import re,html
          t=open('/tmp/dea.html',encoding='utf-8',errors='replace').read()
          print(len(t))
          for m in re.finditer(r'href="([^"]*public_debt_management_documents[^"]*)"',t):
              ctx=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',t[max(0,m.start()-300):m.start()])))[-90:]
              print('LINK',m.group(1)[-100:],'<=',ctx)
          PY

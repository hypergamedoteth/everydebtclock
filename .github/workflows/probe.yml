name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) everydebtclock.com"
          curl -s -m 25 -L -A "$UA" "http://dea.gov.in/reports-public-debt-management" -o /tmp/dea.html
          python3 - <<'PY'
          import re,html
          t=open('/tmp/dea.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'<tr[^>]*>(.*?)</tr>',t,flags=re.S):
              r=m.group(1)
              h=re.findall(r'href="([^"]*\.pdf)"',r)
              if h:
                  txt=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',r))).strip()
                  print('ROW',txt[:150],'=>',h[0][-110:])
          PY

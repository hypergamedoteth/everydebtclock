name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y poppler-utils >/dev/null 2>&1
          python3 - <<'PY2'
          import sys; sys.path.insert(0,'pipeline'); import fetch_india as f, subprocess, tempfile, re
          fs=f.listing(); print('KEYS',sorted(fs))
          for k in sorted(fs,reverse=True)[:6]:
              raw=f.get(fs[k]); open('/tmp/x.pdf','wb').write(raw)
              L=subprocess.run(['pdftotext','-layout','/tmp/x.pdf','-'],capture_output=True,text=True).stdout.splitlines()
              print('DBG',k,len(raw),len(L),[l.strip()[:70] for l in L if 'Table 4' in l][:4])
          PY2
          cp places/india.json /tmp/india0.json; cp places/russia.json /tmp/russia0.json
          python3 pipeline/fetch_india.py; python3 pipeline/fetch_russia.py
          echo "== second run"; python3 pipeline/fetch_india.py; python3 pipeline/fetch_russia.py
          python3 - <<'PY'
          import json
          for n in ('india','russia'):
              a=json.load(open('/tmp/%s0.json'%n)); b=json.load(open('places/%s.json'%n))
              c=b['components'][0]
              print('RES',n,c['as_of'],c['value'],c['prior_as_of'],c['prior_value'],'changed' if a!=b else 'same')
              print('RES hist',c['history'])
              print('RES facts',[(f['key'],f['value'],f['as_of']) for f in c['facts']])
              print('RES next',b['next_update'])
          PY

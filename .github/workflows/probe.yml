name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) everydebtclock.com"
          B=https://minfin.gov.ru/common/upload/library/2026/10/main
          curl -s -m 40 -A "$UA" "$B/graphDynamicsDebt_ru_01.10.2026.xlsx" -o /tmp/g.xlsx -w "%{http_code} %{size_download}\n"
          curl -s -m 40 -A "$UA" "$B/GVD_20261001.xlsx" -o /tmp/e.xlsx -w "%{http_code} %{size_download}\n"
          cat > /tmp/dump.py <<'PY'
          import zipfile,re,sys,html
          z=zipfile.ZipFile(sys.argv[1]); names=z.namelist(); print(names[:12])
          ss=[]
          if 'xl/sharedStrings.xml' in names:
              x=z.read('xl/sharedStrings.xml').decode('utf-8')
              ss=[html.unescape(re.sub(r'<[^>]+>','',m)) for m in re.findall(r'<si>(.*?)</si>',x,flags=re.S)]
          wb=z.read('xl/workbook.xml').decode(); print(re.findall(r'<sheet [^>]*name="([^"]+)"',wb))
          for n in names:
              if n.startswith('xl/worksheets/sheet'):
                  x=z.read(n).decode('utf-8'); print('##',n,len(x))
                  rows=re.findall(r'<row [^>]*>(.*?)</row>',x,flags=re.S)
                  for r in rows[:45]:
                      out=[]
                      for c in re.finditer(r'<c r="([A-Z]+\d+)"([^>]*?)(?:/>|>(.*?)</c>)',r,flags=re.S):
                          ref,attr,body=c.groups(); v=re.search(r'<v>(.*?)</v>',body or '')
                          if not v: continue
                          val=v.group(1)
                          if 't="s"' in attr: val=ss[int(val)]
                          out.append(f'{ref}={val[:40]}')
                      if out: print(' | '.join(out)[:300])
          PY
          python3 /tmp/dump.py /tmp/g.xlsx | head -70
          echo ========== EXT
          python3 /tmp/dump.py /tmp/e.xlsx | head -60

name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) everydebtclock.com"
          curl -s -m 25 -A "$UA" "https://minfin.gov.ru/ru/perfomance/public_debt/internal/" -o /tmp/mf.html
          curl -s -m 25 -A "$UA" "https://minfin.gov.ru/ru/perfomance/public_debt/external/" -o /tmp/mx.html
          python3 - <<'PY'
          import re,html
          for f,keys in (('/tmp/mf.html',['Объем государственного внутреннего долга','гарант']),('/tmp/mx.html',['Объем государственного внешнего долга','внешнего долга Российской Федерации'])):
              raw=open(f,encoding='utf-8',errors='replace').read()
              t=re.sub(r'<script.*?</script>|<style.*?</style>','',raw,flags=re.S)
              t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
              print('=====',f,len(t))
              for k in keys[:1]:
                  for m in list(re.finditer(k,t))[:2]:
                      print(t[max(0,m.start()-300):m.start()+1100]); print('--')
              # raw html near table
              i=raw.find('01.10.2026'); print('RAW:',re.sub(r'\s+',' ',raw[max(0,i-700):i+700]))
          PY

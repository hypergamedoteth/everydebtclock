name: Refresh data and deploy

on:
  schedule:
    # Cron is UTC. Times below are CDT (UTC-5, until Nov 1, 2026) / CST (UTC-6, after). GitHub can start scheduled runs late.
    # 11:30 UTC daily = 6:30 AM CDT / 5:30 AM CST: full morning recalibration (Census, BEA, MTS, OMB, Canada, Mexico, Singapore, UK). Always runs.
    - cron: "30 11 * * *"
    # Weekday checks every 15 min, 19:00-21:00 UTC = 2:00-4:00 PM CDT / 1:00-3:00 PM CST, so Treasury's afternoon
    # Debt to the Penny release reaches the site before the ~3:45 PM CT X post. Each check fetches + deploys only if
    # Treasury has a newer record_date than the committed data; otherwise it ends green with no commit or deploy.
    - cron: "*/15 19-20 * * 1-5"
    - cron: "0 21 * * 1-5"
    # Backup checks at 3:30 PM CT, in case GitHub starts or skips the checks above late: 20:30 UTC = 3:30 PM CDT (until Nov 1, 2026),
    # 21:30 UTC = 3:30 PM CST (after). Gated like the other checks: no new Treasury record means no fetch, commit or deploy.
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
    # 21:45 UTC weekdays = 4:45 PM CDT / 3:45 PM CST: full end-of-day refresh (also picks up late DTS tables). Always runs.
    # Note this lands AFTER a 3:45 PM CT post while CDT is in effect; the checks above are what make the post's data current.
    - cron: "45 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch, commit and deploy even if Treasury has no new record"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  # Cheap gate (no installs): decides whether this run fetches, commits and deploys.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        # Only the 15-min checks and non-forced manual runs are gated on new Treasury data.
        if: (github.event_name == 'schedule' && github.event.schedule != '30 11 * * *' && github.event.schedule != '45 21 * * 1-5') || (github.event_name == 'workflow_dispatch' && !inputs.force)
        run: python3 pipeline/check_new.py
      - id: decide
        run: |
          if [ "${{ steps.check.outcome }}" = "skipped" ] || [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### No new Treasury record (latest ${{ steps.check.outputs.latest }}, committed ${{ steps.check.outputs.committed }}). Skipped fetch, commit and deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Python deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          python -m pip install --upgrade pip
          pip install Pillow openpyxl pypdf

      - name: Fetch official data (skipped on plain pushes)
        if: github.event_name != 'push'
        run: |
          python3 pipeline/fetch.py
          # Canada: re-base places/canada.json to the Bank of Canada's latest month-end figure (Valet API, keyless). Never fails the run.
          python3 pipeline/fetch_canada.py || echo "canada fetch skipped"
          # Mexico: Banco de Mexico SIE table CG7 (net public sector debt, keyless CSV export). Never fails the run.
          python3 pipeline/fetch_mexico.py || echo "mexico fetch skipped"
          # Singapore: SingStat Table Builder M130181 (Total Government Debt, quarterly; AGD and MAS data). Never fails the run.
          python3 pipeline/fetch_singapore.py || echo "singapore fetch skipped"
          # United Kingdom: ONS public sector finances series BKPX / HF6W / CPPH (keyless JSON). Never fails the run.
          python3 pipeline/fetch_united_kingdom.py || echo "united-kingdom fetch skipped"
          # Germany, France, Italy, Spain, Netherlands, Belgium, Austria, Ireland, Poland, Sweden: Eurostat gov_10q_ggdebt (central government Maastricht debt, quarterly) and demo_pjan. Never fails the run.
          python3 pipeline/fetch_eurostat.py || echo "eurostat fetch skipped"
          # Japan: Ministry of Finance Central Government Debt pages (quarterly). Never fails the run.
          python3 pipeline/fetch_japan.py || echo "japan fetch skipped"
          # China: Ministry of Finance Central Government Operations And Debt PDF (SDDS, quarterly; needs pdftotext). Never fails the run.
          python3 pipeline/fetch_china.py || echo "china fetch skipped"
          # India: DEA Quarterly Report on Public Debt Management PDFs (needs pdftotext). Falls back to the committed figure. Never fails the run.
          python3 pipeline/fetch_india.py || echo "india fetch skipped"
          # Russia: Minfin internal debt page (monthly). Falls back to the committed figure. Never fails the run.
          python3 pipeline/fetch_russia.py || echo "russia fetch skipped"
          # Brazil: Banco Central do Brasil SGS 13761 / 13762 (DBGG, monthly). Never fails the run.
          python3 pipeline/fetch_brazil.py || echo "brazil fetch skipped"
          # Batch 3 (Spain, Netherlands, Belgium, Austria, Ireland, Poland, Sweden are in fetch_eurostat.py above)
          # Turkey: Ministry of Treasury and Finance monthly central government debt stock release. Never fails the run.
          python3 pipeline/fetch_turkey.py || echo "turkey fetch skipped"
          # Switzerland: Federal Finance Administration GFS quarterly workbooks. Never fails the run.
          python3 pipeline/fetch_switzerland.py || echo "switzerland fetch skipped"
          # Taiwan: National Treasury Administration open dataset D3-12F (weekly). Never fails the run.
          python3 pipeline/fetch_taiwan.py || echo "taiwan fetch skipped"
          # South Korea: Ministry of Planning and Budget Monthly Fiscal Trends PDF (needs pypdf). Never fails the run.
          python3 pipeline/fetch_korea.py || echo "south-korea fetch skipped"
          # Australia: AOFM Data Hub portfolio aggregate workbook (monthly). Never fails the run.
          python3 pipeline/fetch_australia.py || echo "australia fetch skipped"
          # Indonesia: DJPPR home page debt position (quarterly). Never fails the run.
          python3 pipeline/fetch_indonesia.py || echo "indonesia fetch skipped"
          # Saudi Arabia: National Debt Management Center Reports & Statistics (quarterly). Never fails the run.
          python3 pipeline/fetch_saudi_arabia.py || echo "saudi-arabia fetch skipped"
          python3 pipeline/fetch_qatar.py || echo "qatar fetch skipped"
          python3 pipeline/fetch_nigeria.py || echo "nigeria fetch skipped"
          python3 pipeline/fetch_ghana.py || echo "ghana fetch skipped"
          python3 pipeline/fetch_kenya.py || echo "kenya fetch skipped"
          python3 pipeline/fetch_egypt.py || echo "egypt fetch skipped"
          python3 pipeline/fetch_south_africa.py || echo "south-africa fetch skipped"
          # World Debt Clock inputs: ECB + Bank of Russia daily FX, IMF WEO GDP weights. Keeps the last good file on any failure. Never fails the run.
          python3 pipeline/fetch_world.py || echo "world fetch skipped"

      - name: Build site
        env:
          DEBTCLOCK_SITE_URL: https://everydebtclock.com
        run: python3 build.py

      - name: Guard against placeholder URLs
        run: |
          if grep -rIlE "example[.]com" --exclude-dir=.git --exclude-dir=.github . ; then
            echo "Placeholder URL found"; exit 1
          fi

      # Commits source data only (fetched data, source cache, place data). Built pages, OG images and /api are
      # regenerated by build.py on every run and deployed from the runner, so they don't need committing.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "debtclock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data cache places
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5

      - name: Stage Pages artifact (public files only)
        run: |
          mkdir -p _site
          cp -r index.html 404.html privacy.html CNAME robots.txt sitemap.xml style.css app.js core.js widget.html \
                apple-touch-icon.png icon-512.png data og t api dist how-much-is-the-national-debt national-debt-per-person national-debt-by-year when-will-debt-hit-41-trillion methodology states countries world _site/
          rm -f _site/data/validation_log.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Runs after deploy so a flagged figure is still published with its ⚠ badge, but the run goes red and GitHub emails you.
      - name: Fail on validation flags or unavailable tickers
        run: python3 pipeline/check_flags.py
